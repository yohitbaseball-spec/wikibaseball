name: Generate Search Data JSON 

on:
  push:
    branches:
      - main  # 如果你的預設分支叫 master，請改成 master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate data.json
        run: |
          python -c "
          import os, json, re

          site_data = []

          # ==========================================
          # 🎯 在這裡定義要掃描的資料夾與對應標籤
          # 格式為: \"資料夾路徑\": \"顯示標籤\"
          # 以後想新增資料夾，直接在這裡加一行即可！
          # ==========================================
          SCAN_CONFIG = {
              'players': '台灣球員',
              'awards': '獎項',
              'stadiums': '球場'
          }

          for folder_path, tag in SCAN_CONFIG.items():
              # 如果該資料夾不存在，就直接跳過，避免報錯
              if not os.path.exists(folder_path):
                  continue
                  
              for root, dirs, files in os.walk(folder_path):
                  for file in files:
                      if file.endswith('.html'):
                          filepath = os.path.join(root, file)
                          # 統一將路徑斜線轉為網址用的 '/'
                          url_path = filepath.replace('\\\\', '/')
                          
                          try:
                              with open(filepath, 'r', encoding='utf-8') as f:
                                  content = f.read()
                                  
                                  # 自動抓取網頁的 <title> 內容
                                  title_match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE | re.DOTALL)
                                  title = title_match.group(1).strip() if title_match else file

                                  site_data.append({
                                      'title': title,
                                      'url': url_path,
                                      'tag': tag
                                  })
                          except Exception as e:
                              print(f'讀取失敗 {filepath}: {e}')

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(site_data, f, ensure_ascii=False, indent=2)

          print(f'成功產生 data.json，共找到 {len(site_data)} 個頁面！')
          "

      - name: Commit and Push generated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新搜尋索引 data.json" && git push)
