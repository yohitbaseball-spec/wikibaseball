<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球員名鑑</title>
  
  <link rel="stylesheet" href="../css/award.css">
  <link rel="stylesheet" href="../css/player_directory.css">
</head>
<body>

  <div class="container">
    <div class="topnav">
      <a href="../index.html">首頁</a> / 球員資料總覽
    </div>

    <div class="header">
      <h1>室內棒球聯盟球員名鑑</h1>
      <div class="sub">Player Directory & Historical Database</div>
    </div>

    <section class="award-intro">
      <h2>球員資料總覽</h2>
      <p>
        收錄聯盟成立至今所有現役與歷年球員檔案。您可透過守備位置、投打習慣、姓名注音/字母索引或關鍵字進行多維度即時檢索，點擊球員姓名即可查看完整個人資料。
      </p>
    </section>

    <div class="filter-panel">
      <div class="search-bar-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋球員姓名、背號、球隊或國籍（例：18、猛虎隊、日本）...">
      </div>

      <div class="filter-group">
        <span class="filter-label">守備位置：</span>
        <div class="filter-buttons" id="posFilter">
          <button class="filter-btn active" data-pos="ALL">全部</button>
          <button class="filter-btn" data-pos="P">投手 (P)</button>
          <button class="filter-btn" data-pos="C">捕手 (C)</button>
          <button class="filter-btn" data-pos="IF">內野手 (IF)</button>
          <button class="filter-btn" data-pos="OF">外野手 (OF)</button>
        </div>
      </div>

      <div class="filter-group">
        <span class="filter-label">投打習慣：</span>
        <div class="filter-buttons" id="btFilter">
          <button class="filter-btn active" data-bt="ALL">全部</button>
          <button class="filter-btn" data-bt="右投右打">右投右打</button>
          <button class="filter-btn" data-bt="右投左打">右投左打</button>
          <button class="filter-btn" data-bt="左投左打">左投左打</button>
          <button class="filter-btn" data-bt="左投右打">左投右打</button>
          <button class="filter-btn" data-bt="兩打">兩打</button>
        </div>
      </div>

      <div class="filter-group">
        <span class="filter-label">姓名索引：</span>
        <div class="filter-buttons index-bar" id="alphaIndexBar">
          <button class="filter-btn active" data-index="ALL">全部</button>
        </div>
      </div>
    </div>

    <table class="stats player-directory-table">
      <thead>
        <tr>
          <th style="width: 10%;">背號</th>
          <th style="width: 20%;">球員姓名</th>
          <th style="width: 18%;">所屬球隊</th>
          <th style="width: 12%;">守備位置</th>
          <th style="width: 10%;">國籍</th>
          <th style="width: 15%;">投打習慣</th>
          <th style="width: 15%;">主要榮譽</th>
        </tr>
      </thead>
      <tbody id="playerTableBody">
      </tbody>
    </table>

  </div>

  <script src="../js/player_directory.js"></script>
</body>
</html>
